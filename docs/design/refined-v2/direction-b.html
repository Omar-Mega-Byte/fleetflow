<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="oklch(0.945 0.009 190)"><title>FleetFlow Direction B — Cairo Map Control</title>
<style>
:root{--bg:oklch(.945 .009 190);--surface:oklch(.985 .006 190);--fg:oklch(.20 .025 180);--muted:oklch(.50 .025 185);--border:oklch(.82 .018 185);--accent:oklch(.46 .13 163);--cyan:oklch(.67 .14 210);--amber:oklch(.72 .15 78);--red:oklch(.59 .2 28);--water:oklch(.75 .09 220);--land:oklch(.91 .018 172);--road:oklch(.81 .015 90);--display:"Aptos Display","Segoe UI Variable Display",sans-serif;--body:"Segoe UI Variable Text","Segoe UI",sans-serif;--mono:"Cascadia Mono",monospace;--micro:140ms;--standard:240ms;--r:8px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px var(--body);overflow:hidden}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid oklch(.82 .10 195);outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr)}.top{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);gap:16px;z-index:8}.brand{font:700 16px var(--display);display:flex;align-items:center;gap:9px}.brandmark{width:22px;height:22px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 38%,38% 38%,38% 100%,0 100%)}.preview{font:10px var(--mono);padding:3px 6px;border:1px solid var(--border);border-radius:4px;color:var(--muted)}.tabs{display:flex;gap:2px;height:100%;align-items:center}.tabs button{border:0;background:transparent;color:var(--muted);height:38px;padding:0 10px;border-radius:6px;cursor:pointer;transition:background var(--micro),color var(--micro)}.tabs button:hover{background:var(--bg);color:var(--fg)}.tabs button.active{background:oklch(.91 .035 165);color:oklch(.30 .1 165);font-weight:650}.top .grow{flex:1}.control{min-height:34px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);padding:0 10px;cursor:pointer}.control:hover{border-color:var(--accent)}.primary{background:var(--accent);border-color:var(--accent);color:white}.workspace{position:relative;min-height:0}.map{position:absolute;inset:0;background:var(--land);overflow:hidden}.map svg{display:block;width:100%;height:100%}.river{fill:var(--water)}.island{fill:var(--land);stroke:oklch(.7 .04 210);stroke-width:1.2}.road{fill:none;stroke:var(--road);stroke-width:4}.road.major{stroke:oklch(.69 .03 90);stroke-width:7}.bridge{stroke:oklch(.58 .03 90);stroke-width:3}.label{font:12px var(--body);fill:oklch(.37 .025 180)}.minor{font-size:10px;fill:var(--muted)}.zone{fill:oklch(.61 .12 165/.15);stroke:var(--accent);stroke-width:2}.zone.warn{fill:oklch(.72 .15 78/.12);stroke:var(--amber)}.connector{stroke:var(--cyan);stroke-width:2;stroke-dasharray:5 5;fill:none}.pin{cursor:pointer}.pin circle{stroke:var(--surface);stroke-width:3;fill:var(--accent);transition:r var(--micro)}.pin:hover circle,.pin.selected circle{r:10}.pin.live circle{fill:var(--cyan)}.pin.bad circle{fill:var(--red)}.pin text{font:10px var(--mono);fill:var(--fg)}.rail{position:absolute;top:16px;left:16px;bottom:16px;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 16px 50px oklch(.24 .03 185/.13);display:flex;flex-direction:column;z-index:4}.railhead{padding:16px;border-bottom:1px solid var(--border)}.kicker{font:10px var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}h1{font:650 27px/1.05 var(--display);letter-spacing:-.035em;margin:6px 0}.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.filter{display:flex;padding:10px;border-bottom:1px solid var(--border);gap:6px;overflow:auto}.filter button{border:1px solid var(--border);border-radius:99px;background:var(--surface);padding:5px 9px;white-space:nowrap;font-size:11px;color:var(--muted);cursor:pointer}.filter button.active{background:var(--fg);border-color:var(--fg);color:white}.list{overflow:auto;padding:6px}.delivery{width:100%;text-align:left;border:1px solid transparent;border-bottom-color:var(--border);background:transparent;padding:11px 10px;cursor:pointer;color:var(--fg);transition:background var(--micro),border var(--micro)}.delivery:hover{background:var(--bg)}.delivery.selected{border-color:var(--accent);background:oklch(.95 .025 165);border-radius:6px}.row{display:flex;align-items:center;gap:7px}.row .grow{flex:1}.id{font:12px var(--mono)}.meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.live{background:var(--cyan)}.dot.wait{background:var(--amber)}.dot.bad{background:var(--red)}.dot.good{background:var(--accent)}.legend{position:absolute;right:16px;top:16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;z-index:3;font-size:11px;box-shadow:0 8px 25px oklch(.24 .03 185/.1)}.legend div{display:flex;align-items:center;gap:6px;margin:4px}.attribution{position:absolute;right:12px;bottom:8px;background:var(--surface);padding:4px 6px;border:1px solid var(--border);font-size:9px;color:var(--muted);z-index:3}.sheet{position:absolute;left:332px;bottom:16px;width:min(720px,calc(100% - 364px));min-height:172px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 16px 50px oklch(.24 .03 185/.18);z-index:4;padding:16px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;animation:rise var(--standard) ease-out}.sheet h2{font:650 20px var(--display);margin:4px 0 8px}.sheet p{margin:5px 0;color:var(--muted);font-size:12px}.factgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.fact{border-top:1px solid var(--border);padding-top:7px}.fact b{display:block;font-size:12px}.fact span{font-size:10px;color:var(--muted)}.actions{display:flex;align-items:end;justify-content:flex-end;gap:7px}.statepanel{position:absolute;inset:0;z-index:6;background:var(--surface);display:grid;place-items:center;padding:30px;text-align:center}.statepanel div{max-width:390px}.statepanel h2{font:650 24px var(--display);margin:10px 0}.statepanel p{color:var(--muted);line-height:1.5}.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;margin:auto;animation:spin 900ms linear infinite}.dialog{position:fixed;inset:0;background:oklch(.13 .03 180/.52);z-index:20;display:none;place-items:center;padding:16px}.dialog.open{display:grid}.dialogbox{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 25px 70px oklch(.1 .03 180/.25);padding:20px}.dialogbox h2{font:650 22px var(--display);margin:4px 0 12px}.dialogbox label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}.dialogbox input,.dialogbox select{width:100%;min-height:42px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 10px;color:var(--fg)}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--fg);color:white;padding:11px 14px;border-radius:6px;font-size:12px}.hidden{display:none!important}.screen{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:24px}.screeninner{max-width:1180px;margin:auto}.screen h1{margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px}.card h3{font:650 15px var(--display);margin:0 0 10px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border)}.table th{font-size:11px;color:var(--muted)}.specgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.swatch{height:62px;border-radius:5px;border:1px solid var(--border);padding:7px;display:flex;align-items:end;font-size:10px}.offline{fill:oklch(.87 .01 185)}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.top{overflow:auto}.tabs{order:3;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);border-top:1px solid var(--border);z-index:12;overflow:auto;padding:5px}.tabs button{min-width:86px;height:50px;font-size:11px}.top .preview,.top .grow{display:none}.workspace{padding-bottom:64px}.rail{top:10px;left:10px;right:10px;bottom:auto;width:auto;max-height:210px}.railhead{padding:12px}.railhead h1{font-size:23px}.list{display:flex;overflow:auto}.delivery{min-width:230px;border-bottom:0;border-right:1px solid var(--border)}.sheet{left:10px;right:10px;bottom:74px;width:auto;grid-template-columns:1fr;min-height:0;gap:10px;padding:13px}.factgrid{display:flex;overflow:auto}.fact{min-width:130px}.actions{justify-content:flex-start}.legend{display:none}.screen{padding:16px 12px 82px}.grid,.specgrid{grid-template-columns:1fr}.attribution{bottom:70px}}@media(max-width:520px){.top{padding:0 10px}.brand{font-size:15px}.rail{max-height:190px}.sheet{max-height:300px;overflow:auto}.sheet h2{font-size:18px}.map svg{width:150%;transform:translateX(-18%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head><body><div class="app"><header class="top" data-od-id="map-topbar"><div class="brand" data-od-id="fleetflow-brand"><span class="brandmark"></span>FleetFlow</div><span class="preview">SYNTHETIC PREVIEW</span><nav class="tabs" aria-label="Screens" data-od-id="screen-navigation"></nav><span class="grow"></span><button class="control" id="stateBtn" data-od-id="state-toggle">State: Normal</button><button class="control" id="specBtn" data-od-id="specimen-open">Components</button></header><main class="workspace" id="workspace" data-od-id="map-workspace"></main></div>
<div class="dialog" id="dialog" aria-hidden="true"><form class="dialogbox" id="contextForm"><span class="kicker">Dispatcher order context</span><h2>Open known order</h2><p class="hint">FleetFlow has no dispatcher-wide order list endpoint. Enter an authorized UUID or choose a bounded synthetic seed.</p><label for="uuid">Order UUID</label><input id="uuid" required value="0f1b8cc9-3d20-42e5-9a31-000000000001"><label for="context">Context source</label><select id="context"><option>Authorized synthetic seed</option><option>Explicit order UUID</option></select><div class="dialogactions"><button type="button" class="control" data-close>Cancel</button><button class="control primary">Open order context</button></div></form></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const screens=['Command Center','Orders','Detail / Tracking','Dispatch','Zones','Activity'];let current='Command Center',status='ALL',state='normal',selected='FF-9A31';
const deliveries=[{id:'FF-9A31',status:'IN_TRANSIT',dot:'live',place:'Zamalek → Downtown',fresh:'18 s',x:47,y:38},{id:'FF-1C72',status:'READY_FOR_PICKUP',dot:'wait',place:'Maadi → Garden City',fresh:'2 min',x:49,y:74},{id:'FF-7D04',status:'DISPATCH_FAILED',dot:'bad',place:'Heliopolis → Nasr City',fresh:'6 min',x:71,y:34},{id:'FF-4B18',status:'DRIVER_ASSIGNED',dot:'good',place:'Dokki → Mohandessin',fresh:'44 s',x:31,y:43}];
const workspace=document.querySelector('#workspace'),dialog=document.querySelector('#dialog'),toast=document.querySelector('#toast');
function nav(){document.querySelector('.tabs').innerHTML=screens.map(s=>`<button class="${current===s?'active':''}" data-screen="${s}">${s.replace(' / Tracking','')}</button>`).join('');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{current=b.dataset.screen;render()})}
function baseMap(){return `<section class="map" aria-label="Cairo operational map" data-od-id="cairo-map"><svg viewBox="0 0 1000 650" role="img" aria-label="Schematic geographic context of Cairo with Nile, districts and service zones"><rect width="1000" height="650" fill="var(--land)"/><path class="river" d="M420 -10 C400 90 452 148 426 229 C398 316 448 390 418 479 C396 545 420 610 405 670 L520 670 C531 590 504 525 531 457 C563 376 512 306 544 228 C572 157 526 91 548 -10Z"/><path class="island" d="M454 160 C431 198 438 279 460 318 C479 279 489 207 476 163Z"/><path class="road major" d="M66 318 C237 274 352 292 420 328 M521 325 C640 305 780 270 965 214 M528 452 C681 463 820 508 995 548"/><path class="road" d="M228 101 L386 302 M650 78 L548 294 M676 214 L805 474 M242 533 L414 441 M556 102 L822 106 M605 572 L716 226"/><path class="bridge" d="M378 278 L558 260 M370 374 L548 372 M398 458 L537 455"/><path class="zone" d="M421 170 L493 153 L511 289 L430 320 L403 237Z"/><path class="zone warn" d="M621 105 L803 82 L853 214 L708 286 L604 210Z"/><path class="zone" d="M396 421 L520 414 L572 548 L418 583 L356 509Z"/><text class="label" x="443" y="220">Zamalek</text><text class="label" x="538" y="330">Downtown</text><text class="label" x="283" y="335">Dokki</text><text class="label" x="230" y="287">Mohandessin</text><text class="label" x="690" y="143">Heliopolis</text><text class="label" x="748" y="294">Nasr City</text><text class="label" x="446" y="520">Maadi</text><text class="label" x="524" y="418">Garden City</text><text class="label" x="818" y="510">New Cairo</text><text class="minor" x="464" y="60">Nile</text><text class="minor" x="473" y="485">Nile</text><path class="connector" d="M467 248 L530 340"/><text class="minor" x="476" y="305">straight connector · not road route</text>${deliveries.map(d=>`<g class="pin ${d.dot==='live'?'live':d.dot==='bad'?'bad':''} ${selected===d.id?'selected':''}" data-pin="${d.id}" data-od-id="map-order-${d.id.toLowerCase()}" transform="translate(${d.x*10} ${d.y*6.5})"><circle r="8"/><text x="14" y="4">${d.id}</text></g>`).join('')}</svg><div class="attribution">Cairo schematic fallback · no map tiles · not for navigation</div></section>`}
function rail(){let list=deliveries.filter(d=>status==='ALL'||d.status===status);return `<aside class="rail" data-od-id="delivery-context-rail"><div class="railhead"><span class="kicker">Customer coverage · Cairo</span><h1 data-od-id="page-title">${current==='Zones'?'Branch zones':'Live order context'}</h1><p class="hint">Role-scoped synthetic data with freshness and gaps visible.</p></div><div class="filter">${['ALL','IN_TRANSIT','READY_FOR_PICKUP','DISPATCH_FAILED'].map(s=>`<button data-filter="${s}" class="${status===s?'active':''}">${s.replaceAll('_',' ')}</button>`).join('')}</div><div class="list">${list.map(d=>`<button class="delivery ${selected===d.id?'selected':''}" data-delivery="${d.id}" data-od-id="delivery-${d.id.toLowerCase()}"><span class="row"><i class="dot ${d.dot}"></i><b class="id">${d.id}</b><span class="grow"></span><span>${d.status.replaceAll('_',' ')}</span></span><span class="meta"><span>${d.place}</span><span>${d.fresh}</span></span></button>`).join('')}</div></aside>`}
function sheet(){let d=deliveries.find(x=>x.id===selected);return `<section class="sheet" data-od-id="selected-delivery-sheet"><div><span class="kicker">Selected synthetic order</span><h2><span class="id">${d.id}</span> · ${d.status.replaceAll('_',' ')}</h2><p>${d.place}. Position snapshot reported ${d.fresh} ago.</p><div class="factgrid"><div class="fact"><b>Authorized</b><span>order detail + tracking</span></div><div class="fact"><b>Coverage</b><span>snapshot + bearer SSE</span></div><div class="fact"><b>Unavailable</b><span>driver identity + ETA</span></div><div class="fact"><b>Geometry</b><span>no routed road line</span></div></div></div><div class="actions"><button class="control" id="detailsBtn" data-od-id="inspect-snapshot">Inspect snapshot</button><button class="control primary" id="openContext" data-od-id="open-order-context">Open context</button></div></section>`}
function mapView(){return baseMap()+rail()+sheet()+`<aside class="legend"><div><i class="dot live"></i> fresh position</div><div><i class="dot wait"></i> waiting lifecycle</div><div><i class="dot bad"></i> intervention</div><div><i class="dot good"></i> committed</div></aside>`}
function stateOverlay(){if(state==='normal')return '';let title=state==='loading'?'Loading authorized geography':state==='empty'?'No orders in this view':state==='error'?'Map context is unavailable':'Offline map fallback';let copy=state==='loading'?'Preserving map and sheet geometry while role-scoped data loads.':state==='empty'?'Clear the status filter or choose another known context. Production order creation is not available.':state==='error'?'Keep the selected order sheet usable and retry the geographic context.':'Cairo district labels and zone polygons remain available without external tiles.';return `<div class="statepanel"><div>${state==='loading'?'<div class="spinner"></div>':'<span class="kicker">'+state+' state</span>'}<h2>${title}</h2><p>${copy}</p><button class="control" id="recoverBtn">${state==='empty'?'Clear filter':'Return to map'}</button></div></div>`}
function ordersScreen(){return `<section class="screen"><div class="screeninner"><span class="kicker">Customer · synthetic design preview</span><h1>Orders by place</h1><p class="hint">Supported list filters only: branchId, status, from, to, page, size and createdAt/id sort.</p><div class="card" style="margin-top:18px;overflow:auto"><table class="table"><thead><tr><th>Order</th><th>Status</th><th>Geographic context</th><th>Freshness</th></tr></thead><tbody>${deliveries.map(d=>`<tr data-row="${d.id}"><td class="id">${d.id}</td><td><span class="row"><i class="dot ${d.dot}"></i>${d.status}</span></td><td>${d.place}</td><td>${d.fresh}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function detailScreen(){let d=deliveries.find(x=>x.id===selected);return `<section class="screen"><div class="screeninner"><span class="kicker">Customer · selected order</span><h1>${d.id} tracking snapshot</h1><p class="hint">The map marker is a point observation, not turn-by-turn navigation.</p><div class="grid" style="margin-top:18px"><div class="card"><h3>Snapshot fields</h3><p>orderStatus · orderVersion · deliveryStatus · observedAt · position · terminal</p></div><div class="card"><h3>Freshness</h3><p><i class="dot ${d.dot}" style="display:inline-block"></i> ${d.fresh} since reported position</p></div><div class="card"><h3>Not available</h3><p>Driver identity, routed geometry, speed and delivery ETA.</p></div></div><button class="control primary" style="margin-top:16px" id="mapReturn">Return to selected map</button></div></section>`}
function dispatchScreen(){return `<section class="screen"><div class="screeninner"><span class="kicker">Dispatcher · explicit order context</span><h1>Matching evidence</h1><p class="hint">No global dispatcher queue is represented. Candidate distance and straightLineSeconds are estimates, not ETA.</p><div class="grid" style="margin-top:18px"><div class="card"><h3>Rank 1 · driver …71d</h3><p>Eligible · distance 1,420 m · GPS age 12 s · score 0.86 · straightLineSeconds 204</p></div><div class="card"><h3>Rank 2 · driver …34a</h3><p>Eligible · distance 2,180 m · GPS age 49 s · score 0.68 · straightLineSeconds 314</p></div><div class="card"><h3>Excluded · driver …08f</h3><p>Missing location heartbeat. Candidate cannot be scored.</p></div></div><button class="control primary" style="margin-top:16px" id="dispatchContext">Choose order UUID</button></div></section>`}
function zonesScreen(){return baseMap()+rail()+`<section class="sheet"><div><span class="kicker">Merchant · exact branch scope</span><h2>Zamalek core · version 12</h2><p>Active GeoJSON polygon. Replace requires expectedVersion; serviceability remains branch-scoped.</p><div class="factgrid"><div class="fact"><b>Branch</b><span class="id">7b2a…c104</span></div><div class="fact"><b>Policy</b><span>standard service</span></div></div></div><div class="actions"><button class="control" id="conflictBtn">Preview conflict</button><button class="control primary" id="zoneBtn">Replace v12</button></div></section>`}
function activityScreen(){return `<section class="screen"><div class="screeninner"><span class="kicker">Capability-aware activity</span><h1>Notifications & recovery</h1><p class="hint">This is not a universal Kafka event feed.</p><div class="grid" style="margin-top:18px"><div class="card"><h3>Customer</h3><p>Order picked up · self-scoped notification · 2 min</p></div><div class="card"><h3>Driver</h3><p>Offer expires soon · self-scoped notification · 3 min</p></div><div class="card"><h3>Admin</h3><p>Failed outbox replay completed · audited recovery list · 6 min</p></div></div></div></section>`}
function specimen(){return `<section class="screen"><div class="screeninner"><span class="kicker">Direction B design system</span><h1>Map control specimen</h1><div class="specgrid"><div class="card"><h3>Surface strategy</h3><p>Persistent geospatial canvas, compact contextual rail and anchored selected-delivery sheet.</p></div><div class="card"><h3>Motion</h3><p>140 ms hover/focus, 240 ms sheet rise. Transform and opacity only. Reduced-motion removes both.</p></div><div class="card"><h3>State cues</h3><p><i class="dot live" style="display:inline-block"></i> live &nbsp; <i class="dot wait" style="display:inline-block"></i> wait &nbsp; <i class="dot bad" style="display:inline-block"></i> intervention</p></div><div class="card"><h3>Token roles</h3><div class="grid"><span class="swatch" style="background:var(--accent);color:white">emerald</span><span class="swatch" style="background:var(--cyan)">cyan</span><span class="swatch" style="background:var(--land)">land</span></div></div></div></div></section>`}
function render(){nav();workspace.innerHTML=(current==='Command Center'?mapView():current==='Orders'?ordersScreen():current==='Detail / Tracking'?detailScreen():current==='Dispatch'?dispatchScreen():current==='Zones'?zonesScreen():current==='Activity'?activityScreen():specimen())+stateOverlay();bind();document.title='FleetFlow B — '+current}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{status=b.dataset.filter;render()});document.querySelectorAll('[data-delivery],[data-pin],[data-row]').forEach(x=>x.onclick=()=>{selected=x.dataset.delivery||x.dataset.pin||x.dataset.row;current=x.dataset.row?'Detail / Tracking':current;render()});document.querySelector('#openContext')?.addEventListener('click',openDialog);document.querySelector('#dispatchContext')?.addEventListener('click',openDialog);document.querySelector('#detailsBtn')?.addEventListener('click',()=>{current='Detail / Tracking';render()});document.querySelector('#mapReturn')?.addEventListener('click',()=>{current='Command Center';render()});document.querySelector('#zoneBtn')?.addEventListener('click',()=>notify('Synthetic replacement prepared with expectedVersion 12.'));document.querySelector('#conflictBtn')?.addEventListener('click',()=>notify('Version conflict: reload current branch GeoJSON before replacing.'));document.querySelector('#recoverBtn')?.addEventListener('click',()=>{state='normal';status='ALL';syncState();render()})}
function openDialog(){dialog.classList.add('open');dialog.setAttribute('aria-hidden','false');document.querySelector('#uuid').focus()}function closeDialog(){dialog.classList.remove('open');dialog.setAttribute('aria-hidden','true')}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeDialog);document.querySelector('#contextForm').onsubmit=e=>{e.preventDefault();closeDialog();notify('Authorized synthetic order context opened.');current='Dispatch';render()};function notify(msg){toast.textContent=msg;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2500)}function syncState(){document.querySelector('#stateBtn').textContent='State: '+state[0].toUpperCase()+state.slice(1)}document.querySelector('#stateBtn').onclick=()=>{let states=['normal','loading','empty','error','offline'];state=states[(states.indexOf(state)+1)%states.length];syncState();render()};document.querySelector('#specBtn').onclick=()=>{current='Specimen';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});render();
</script></body></html>
