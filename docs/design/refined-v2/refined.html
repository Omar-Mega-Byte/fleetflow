function bind(){document.querySelector('#statusFilter')?.addEventListener('change',e=>{statusFilter=e.target.value;render()});document.querySelector('#pageSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('[data-order-row],.mobileOrder').forEach(row=>row.classList.toggle('hidden',!row.textContent.toLowerCase().includes(q))) });document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.order;openOrderDrawer()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;render()});document.querySelectorAll('[data-switch-role]').forEach(b=>b.onclick=()=>{role=b.dataset.switchRole;syncRole();render()});document.querySelector('#stateRecover')?.addEventListener('click',()=>{previewState='normal';syncState();render()});document.querySelector('#partialDetails')?.addEventListener('click',openTechnicalDrawer);document.querySelector('#detailsBtn')?.addEventListener('click',openTechnicalDrawer);document.querySelector('#trackingDetails')?.addEventListener('click',openTechnicalDrawer);document.querySelector('#retryBtn')?.addEventListener('click',()=>notify('Synthetic retry preview prepared; no request was sent.'));document.querySelector('#incidentBtn')?.addEventListener('click',openIncidentModal);document.querySelector('#editZoneBtn')?.addEventListener('click',openZoneModal);document.querySelector('#conflictBtn')?.addEventListener('click',()=>notify('Version conflict: reload the active zone before replacing version 12.'));document.querySelector('#acceptOffer')?.addEventListener('click',()=>notify('Synthetic offer accepted locally for preview.'));document.querySelector('#rejectOffer')?.addEventListener('click',()=>notify('Synthetic offer rejected locally for preview.'));document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=openReplayModal);document.querySelector('#inspectQuarantine')?.addEventListener('click',()=>openInfoModal('Quarantined event','Inspection only. The record has no replay action in this view.'))}
function drawerTemplate(kind){let o=selectedOrder();if(kind==='system')return `<span class="eyebrow">Component specimen</span><h2 id="drawerTitle">FleetFlow interface system</h2><p class="lede">Exact tokens, component states and motion behavior used by the refined target.</p><div class="specGrid"><section class="specBlock"><h3>Actions</h3><button class="btn primary">Primary</button> <button class="btn">Secondary</button> <button class="btn danger">Intervention</button></section><section class="specBlock"><h3>Status</h3><span class="status"><i class="dot fresh"></i>Fresh</span><br><span class="status"><i class="dot wait"></i>Waiting</span><br><span class="status"><i class="dot bad"></i>Intervention</span></section><section class="specBlock"><h3>Inputs</h3><label for="specInput" class="eyebrow">Known order</label><input id="specInput" value="0f1b…9a31" style="width:100%;min-height:40px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 9px"></section><section class="specBlock"><h3>Palette</h3><div class="swatches"><i class="swatch" style="background:var(--shell);color:white">shell</i><i class="swatch" style="background:var(--emerald);color:white">action</i><i class="swatch" style="background:var(--cyan)">fresh</i><i class="swatch" style="background:var(--amber)">wait</i><i class="swatch" style="background:var(--red);color:white">alert</i></div></section><section class="specBlock"><h3>Density</h3><p class="lede">28 px titles · 14 px body/controls · 12 px metadata · 42 px desktop rows · 44 px minimum touch targets.</p></section><section class="specBlock"><h3>Motion</h3><p class="lede">140 ms feedback · 220 ms structural · transform/opacity only · reduced motion honored.</p></section></div>`;if(kind==='technical')return `<span class="eyebrow">Technical details</span><h2 id="drawerTitle">Source & contract evidence</h2><p class="lede">Implementation evidence stays here instead of interrupting ordinary task flow.</p><div class="detailStack" style="margin-top:14px"><section class="dataBlock"><h3>Identity & ownership</h3><p class="lede">Production preserves OIDC PKCE, customer ownership, exact merchant branch scope, driver self scope and order-scoped dispatcher access.</p></section><section class="dataBlock"><h3>Tracking boundary</h3><p class="lede">The public order view exposes address line and city. Tracking may expose one optional authorized driver position. No route, ETA, speed or global driver map is shown.</p></section><section class="dataBlock"><h3>Preview status</h3><p class="lede">All content and interactions are synthetic. This file does not connect to a backend or mutate operational data.</p></section></div>`;return `<span class="eyebrow">Selected synthetic ${role==='DRIVER'?'delivery':'order'}</span><h2 id="drawerTitle" class="mono">${role==='DRIVER'?'DLV-2C18':o.id}</h2><span class="status"><i class="dot ${o.kind||'fresh'}"></i>${role==='DRIVER'?'IN_TRANSIT':o.status}</span>${lifecycle(role==='DRIVER'?'driver':'order')}<div class="detailStack"><section class="dataBlock"><h3>Visible detail</h3><dl><dt>Pickup</dt><dd>26 July St, Cairo</dd><dt>Delivery</dt><dd>Tahrir Square, Cairo</dd><dt>Last observed</dt><dd>${o.fresh||'12 s'} ago</dd></dl></section><section class="dataBlock"><h3>Location</h3><p class="lede">${o.position?'Authorized position is available for this order.':'Waiting for an authorized position observation.'}</p></section></div>`}
function openDrawer(kind='order'){lastFocus=document.activeElement;drawerContent.innerHTML=drawerTemplate(kind);drawerLayer.classList.add('open');drawerLayer.setAttribute('aria-hidden','false');drawerLayer.querySelector('[data-close-drawer]').focus()}
function openOrderDrawer(){openDrawer('order')}function openTechnicalDrawer(){openDrawer('technical')}function openSystemDrawer(){openDrawer('system')}
function closeDrawer(){drawerLayer.classList.remove('open');drawerLayer.setAttribute('aria-hidden','true');lastFocus?.focus()}
function openModal(content){lastFocus=document.activeElement;modalContent.innerHTML=content;modalLayer.classList.add('open');modalLayer.setAttribute('aria-hidden','false');requestAnimationFrame(()=>modalLayer.querySelector('input,textarea,select,button')?.focus())}
function closeModal(){modalLayer.classList.remove('open');modalLayer.setAttribute('aria-hidden','true');lastFocus?.focus()}
function openIncidentModal(){openModal(`<span class="eyebrow">Synthetic dispatcher action</span><h2 id="modalTitle">Open incident</h2><p class="lede">Record the exception against the active order context.</p><div class="field"><label for="incidentNote">Incident note</label><textarea id="incidentNote">Location heartbeat is missing; review before retrying dispatch.</textarea></div><div class="modalActions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveIncident">Save synthetic incident</button></div>`);document.querySelector('#saveIncident').onclick=()=>{closeModal();notify('Synthetic incident saved locally for preview.')};bindModalClose()}
function openZoneModal(){openModal(`<span class="eyebrow">Merchant · branch 7b2a…c104</span><h2 id="modalTitle">Edit service zone</h2><p class="lede">Validate the GeoJSON before preparing a versioned replacement.</p><div class="field"><label for="zoneName">Zone name</label><input id="zoneName" value="Zamalek core"></div><div class="field"><label for="zoneGeo">GeoJSON</label><textarea id="zoneGeo">${zoneGeo}</textarea><div class="fieldError hidden" id="zoneError">Enter a Polygon with a closed coordinate ring.</div></div><div class="modalActions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="validateZone">Validate & prepare v13</button></div>`);document.querySelector('#validateZone').onclick=()=>{let val=document.querySelector('#zoneGeo').value;let valid=false;try{let parsed=JSON.parse(val);valid=parsed.type==='Polygon'&&parsed.coordinates?.[0]?.length>=4}catch{}document.querySelector('#zoneError').classList.toggle('hidden',valid);if(valid){closeModal();notify('Zone valid. Synthetic replacement prepared with expected version 12.')}};bindModalClose()}
function openReplayModal(){openModal(`<span class="eyebrow">Admin recovery inspection</span><h2 id="modalTitle">Review failed outbox record</h2><p class="lede">Replay is an audited, scoped action. This preview does not call the backend.</p><div class="dataBlock" style="margin-top:13px"><dl><dt>Record</dt><dd class="mono">evt-91a</dd><dt>Type</dt><dd>PaymentRequested</dd><dt>Attempts</dt><dd>3</dd><dt>Last failure</dt><dd>14:25 EET</dd></dl></div><div class="modalActions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="confirmReplay">Replay synthetic record</button></div>`);document.querySelector('#confirmReplay').onclick=()=>{closeModal();notify('Synthetic replay completed locally; audit preview retained.')};bindModalClose()}
function openInfoModal(title,copy){openModal(`<span class="eyebrow">Inspection</span><h2 id="modalTitle">${title}</h2><p class="lede">${copy}</p><div class="modalActions"><button class="btn primary" data-close-modal>Done</button></div>`);bindModalClose()}
function bindModalClose(){modalLayer.querySelectorAll('[data-close-modal]').forEach(x=>x.onclick=closeModal)}
function trapFocus(event,layer){if(event.key!=='Tab')return;let focusables=[...layer.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x=>x.offsetParent!==null);if(!focusables.length)return;let first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
function notify(message){toast.textContent=message;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2600)}
function syncState(){stateBtn.lastChild.textContent=previewState[0].toUpperCase()+previewState.slice(1)}
document.querySelector('#roleSelect').onchange=e=>{role=e.target.value;syncRole();render()};stateBtn.onclick=()=>{let states=['normal','loading','empty','error','partial'];previewState=states[(states.indexOf(previewState)+1)%states.length];syncState();render()};helpBtn.onclick=openTechnicalDrawer;systemBtn.onclick=openSystemDrawer;document.querySelectorAll('[data-close-drawer]').forEach(x=>x.onclick=closeDrawer);document.querySelectorAll('[data-close-modal]').forEach(x=>x.onclick=closeModal);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalLayer.classList.contains('open'))closeModal();else if(drawerLayer.classList.contains('open'))closeDrawer()}if(modalLayer.classList.contains('open'))trapFocus(e,modalLayer);else if(drawerLayer.classList.contains('open'))trapFocus(e,drawerLayer)});syncRole();render();
</script>
</body>
</html>
