<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FleetFlow — every handoff has a state</title>
  <desc id="desc">A restrained dispatch route moves through three waypoints across a dark coordinate field.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24343E" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#101C24"/>
    <rect x="535" width="665" height="360" fill="url(#grid)" opacity=".7"/>
    <path d="M536 0V360" stroke="#344650"/>

    <!-- A quiet cartographic field; only the selected dispatch path is bright. -->
    <g fill="none" stroke="#344B54" stroke-width="1.5" opacity=".85">
      <path d="M548 289C634 290 668 207 739 202S842 275 918 245 1019 153 1201 180"/>
      <path d="M571 351C649 300 702 332 769 266S865 179 939 202 1092 318 1201 270"/>
      <path d="M665 0C638 56 697 89 748 88S858 19 915 58 1035 111 1200 44"/>
    </g>
    <g fill="none" stroke="#526972" stroke-width="1" stroke-dasharray="3 9">
      <path d="M606 317L1144 63"/>
      <path d="M706 13L962 351"/>
    </g>
    <path d="M573 280C635 275 669 226 729 222S806 257 852 207 901 129 957 139 1021 204 1075 168 1130 104 1198 111"
          fill="none" stroke="#173E43" stroke-width="13" stroke-linecap="round"/>
    <path d="M573 280C635 275 669 226 729 222S806 257 852 207 901 129 957 139 1021 204 1075 168 1130 104 1198 111"
          fill="none" stroke="#8BD9CB" stroke-width="3" stroke-linecap="round"/>
    <g fill="#101C24" stroke="#8BD9CB">
      <circle cx="729" cy="222" r="14" stroke-width="2"/>
      <circle cx="957" cy="139" r="14" stroke-width="2"/>
      <circle cx="1075" cy="168" r="14" stroke-width="2"/>
    </g>
    <g fill="#8BD9CB">
      <circle cx="729" cy="222" r="4"/>
      <circle cx="957" cy="139" r="4"/>
      <circle cx="1075" cy="168" r="4"/>
      <circle cx="621" cy="310" r="3" opacity=".8"/>
      <circle cx="858" cy="52" r="3" opacity=".8"/>
      <circle cx="1133" cy="268" r="3" opacity=".8"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#BED0D2">
      <text x="655" y="259">01 / ORDER</text>
      <text x="901" y="101">02 / OFFER</text>
      <text x="1011" y="216">03 / ARRIVAL</text>
    </g>

    <!-- The brand mark uses route segments rather than an unrelated truck icon. -->
    <g fill="none" stroke="#8BD9CB" stroke-width="3" stroke-linecap="square">
      <path d="M70 58V29H92M70 42H87"/>
      <path d="M99 58V29H121M99 42H116" opacity=".48"/>
    </g>
    <text x="140" y="49" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="4" fill="#BED0D2">FLEETFLOW</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" letter-spacing="-1.8" fill="#F2F6F4">
      <text x="67" y="153">EVERY HANDOFF</text>
      <text x="67" y="217">HAS A STATE.</text>
    </g>
    <path d="M68 256H448" stroke="#536971"/>
    <path d="M68 256H163" stroke="#8BD9CB" stroke-width="3"/>
    <text x="68" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2" fill="#B6C9CB">ORDER  /  DISPATCH  /  DELIVERY</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#53666C" stroke-width="2"/>
</svg>
