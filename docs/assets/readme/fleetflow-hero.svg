    <path d="M577 256C652 237 701 261 789 225S912 213 959 182 1014 147 1072 143" fill="none" stroke="#123C3D" stroke-width="12" stroke-linecap="round"/>
    <path d="M577 256C652 237 701 261 789 225S912 213 959 182 1014 147 1072 143" fill="none" stroke="#8EDACB" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#16262D" stroke="#8AA5A8" stroke-width="1.8"><circle cx="516" cy="146" r="8"/><circle cx="677" cy="83" r="8"/><circle cx="671" cy="285" r="8"/></g>
    <g fill="#A8BEC0"><circle cx="516" cy="146" r="2.5"/><circle cx="677" cy="83" r="2.5"/><circle cx="671" cy="285" r="2.5"/></g>
    <circle cx="577" cy="256" r="14" fill="#172831" stroke="#8EDACB" stroke-width="2.5"/>
    <path d="M570 256H584M577 249V263" stroke="#8EDACB" stroke-width="2"/>
