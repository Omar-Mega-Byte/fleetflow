<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FleetFlow dispatch schematic</title>
  <desc id="desc">A selected driver route connects a pickup to a delivery inside a service zone. Other candidates remain muted; a small state rail traces order, offer, and delivery.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#293B43" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#111D24"/>
    <rect width="354" height="360" fill="#172831"/>
    <path d="M354 0V360" stroke="#526871"/>
    <rect x="355" width="845" height="360" fill="url(#grid)" opacity=".73"/>
    <!-- The heading in the README remains the primary title. -->
    <g fill="none" stroke="#8EDACB" stroke-width="3" stroke-linecap="square">
      <path d="M48 70V36H71M48 51H66"/><path d="M80 70V36H103M80 51H98" opacity=".5"/>
    </g>
    <text x="126" y="61" fill="#F2F6F4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing=".7">FleetFlow</text>
    <text x="48" y="116" fill="#94ADB3" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2">DELIVERY ORCHESTRATION</text>
    <path d="M48 141H303" stroke="#425B64"/>
    <path d="M67 178V281" fill="none" stroke="#4E6970" stroke-width="2"/>
    <path d="M67 178V229" fill="none" stroke="#8EDACB" stroke-width="2"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="1.3">
      <circle cx="67" cy="179" r="7" fill="#172831" stroke="#8EDACB" stroke-width="2"/>
      <circle cx="67" cy="229" r="7" fill="#172831" stroke="#8EDACB" stroke-width="2"/>
      <circle cx="67" cy="280" r="7" fill="#172831" stroke="#76939A" stroke-width="2"/>
      <text x="92" y="183" fill="#E8F0EF">01  ORDER</text>
      <text x="92" y="233" fill="#E8F0EF">02  ATOMIC OFFER</text>
      <text x="92" y="284" fill="#BDD0D1">03  DELIVERY</text>
    </g>
    <text x="48" y="329" fill="#91A9AF" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.3">STATE IS A FIRST-CLASS SIGNAL</text>
    <!-- Abstract street fabric and an enforced service area; this is a schematic, not a map. -->
    <g fill="none" stroke="#36505A" stroke-width="1.5" opacity=".8">
      <path d="M386 230C500 209 580 253 686 201S863 135 977 184 1119 179 1210 124"/>
      <path d="M422 362C515 295 576 317 654 290S793 231 887 281 1075 325 1210 254"/>
      <path d="M465-15C503 73 559 100 644 87S766 22 864 71 1040 94 1210 30"/>
      <path d="M604-12C594 83 616 142 641 209S686 317 720 372"/>
      <path d="M930-10C906 63 915 122 941 188S1001 280 1013 370"/>
    </g>
    <path d="M891 61L1077 48 1170 104 1158 226 1020 278 904 220 855 124Z" fill="#8EDACB" fill-opacity=".035" stroke="#789A96" stroke-width="1.5" stroke-dasharray="6 7"/>
    <text x="955" y="82" fill="#B5CBC9" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.5">SERVICE ZONE</text>
    <g fill="none" stroke="#607981" stroke-width="1.5" stroke-dasharray="4 7" opacity=".7">
