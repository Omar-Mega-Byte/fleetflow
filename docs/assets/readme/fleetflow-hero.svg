    <g fill="#DDEAE7" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.2">
      <text x="391" y="38" fill="#9FB6BA">DISPATCH / SCHEMATIC</text>
      <text x="485" y="285">DRIVER</text><text x="752" y="254">PICKUP</text><text x="1035" y="177">DROP-OFF</text>
    </g>
    <rect x="394" y="301" width="768" height="39" rx="5" fill="#172831" stroke="#3E5961"/>
    <g fill="#AFC5C5" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1">
      <text x="414" y="325">GEO PREFILTER</text><text x="598" y="325">DURABLE CHECK</text>
      <text x="779" y="325" fill="#A8E1D4">EXCLUSIVE OFFER</text><text x="987" y="325">EVENT STREAM</text>
    </g>
    <g fill="#6B8E91"><circle cx="571" cy="321" r="2"/><circle cx="752" cy="321" r="2"/><circle cx="958" cy="321" r="2"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="none" stroke="#62777B" stroke-width="2"/>
</svg>
