services:
  postgres:
    image: ${FLEETFLOW_POSTGIS_IMAGE:-postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f}
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"select count(*) from pg_extension where extname = 'postgis'\" 2>/dev/null)\" = 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: ${FLEETFLOW_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244}
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:${OIDC_PORT:-8081}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?Set KC_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${OIDC_PORT:-8081}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./src/main/resources/oidc/fleetflow-realm.json:/opt/keycloak/data/import/fleetflow-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Redis is ephemeral; its optional host access is loopback only.

  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: fleetflow-app:${FLEETFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_JWKS_URI: http://keycloak:8080/realms/fleetflow/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_SWEEP_INTERVAL_MS: ${OUTBOX_SWEEP_INTERVAL_MS:-5000}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-30s}
      OUTBOX_SEND_TIMEOUT: ${OUTBOX_SEND_TIMEOUT:-5s}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-20}
      OUTBOX_PUBLISHED_RETENTION: ${OUTBOX_PUBLISHED_RETENTION:-30d}
      OUTBOX_PRUNE_BATCH_SIZE: ${OUTBOX_PRUNE_BATCH_SIZE:-500}
      OUTBOX_PRUNE_INTERVAL_MS: ${OUTBOX_PRUNE_INTERVAL_MS:-3600000}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      RECOVERY_BATCH_SIZE: ${RECOVERY_BATCH_SIZE:-50}
      RECOVERY_SWEEP_INTERVAL_MS: ${RECOVERY_SWEEP_INTERVAL_MS:-5000}
      RATE_READ_LIMIT: ${RATE_READ_LIMIT:-60}
      RATE_EXPENSIVE_READ_LIMIT: ${RATE_EXPENSIVE_READ_LIMIT:-30}
      RATE_COMMAND_LIMIT: ${RATE_COMMAND_LIMIT:-30}
      RATE_STREAM_LIMIT: ${RATE_STREAM_LIMIT:-6}
      RATE_DEMO_WRITE_LIMIT: ${RATE_DEMO_WRITE_LIMIT:-5}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_OIDC_ISSUER: ${DEMO_OIDC_ISSUER:-${OIDC_ISSUER:?Set OIDC_ISSUER in .env}}
      DEMO_CUSTOMER_SUBJECT: ${DEMO_CUSTOMER_SUBJECT:-fleetflow-demo-customer}
      DEMO_MERCHANT_SUBJECT: ${DEMO_MERCHANT_SUBJECT:-fleetflow-demo-merchant}
      DEMO_DRIVER_SUBJECT: ${DEMO_DRIVER_SUBJECT:-fleetflow-demo-driver}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  keycloak_data:
  kafka_data:
