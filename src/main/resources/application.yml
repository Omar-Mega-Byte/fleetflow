spring:
  application:
    name: fleetflow
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:}
          jwk-set-uri: ${OIDC_JWKS_URI:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      connection-init-sql: "SET statement_timeout = '15s'; SET lock_timeout = '3s'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    admin:
      fail-fast: false
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      auto-startup: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    threads:
      max: 64
    max-connections: 200
    accept-count: 50
    max-http-form-post-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: fleetflow
        version: ${FLEETFLOW_VERSION:local}
      stacktrace:
        max-length: 2048
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
  level:
    org.hibernate.orm.jdbc.error: OFF
    # Framework recovery logging can include ConsumerRecord values and exception parameters.
    # Safe failure counters and structured recovery logs are emitted by EventKafkaConfiguration.
    org.springframework.kafka.listener.DefaultErrorHandler: OFF
fleetflow:
  rate:
    read-limit: ${RATE_READ_LIMIT:60}
    expensive-read-limit: ${RATE_EXPENSIVE_READ_LIMIT:30}
    command-limit: ${RATE_COMMAND_LIMIT:30}
    stream-limit: ${RATE_STREAM_LIMIT:6}
    demo-write-limit: ${RATE_DEMO_WRITE_LIMIT:5}
  events:
    topic: ${EVENTS_TOPIC:fleetflow.domain-events.v1}
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    sweep-interval-ms: ${OUTBOX_SWEEP_INTERVAL_MS:5000}
    lease-duration: ${OUTBOX_LEASE_DURATION:30s}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:5s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:20}
    published-retention: ${OUTBOX_PUBLISHED_RETENTION:30d}
    prune-batch-size: ${OUTBOX_PRUNE_BATCH_SIZE:500}
    prune-interval-ms: ${OUTBOX_PRUNE_INTERVAL_MS:3600000}
  security:
    audience: ${OIDC_AUDIENCE:}
  location:
    heartbeat-ttl: ${LOCATION_HEARTBEAT_TTL:30s}
    location-ttl: ${LOCATION_TTL:2m}
    max-gps-age: ${LOCATION_MAX_GPS_AGE:45s}
    max-ingest-age: ${LOCATION_MAX_INGEST_AGE:2m}
    future-skew: ${LOCATION_FUTURE_SKEW:5s}
    max-radius-meters: ${LOCATION_MAX_RADIUS_METERS:20000}
    max-results: ${LOCATION_MAX_RESULTS:50}
    overfetch-factor: ${LOCATION_OVERFETCH_FACTOR:4}
    overfetch-cap: ${LOCATION_OVERFETCH_CAP:200}
    update-limit: ${LOCATION_UPDATE_LIMIT:30}
    update-window: ${LOCATION_UPDATE_WINDOW:1m}
    heartbeat-limit: ${LOCATION_HEARTBEAT_LIMIT:60}
    heartbeat-window: ${LOCATION_HEARTBEAT_WINDOW:1m}
  matching:
    radius-meters: ${MATCH_RADIUS_METERS:5000}
    candidate-limit: ${MATCH_CANDIDATE_LIMIT:50}
    distance-weight: ${MATCH_DISTANCE_WEIGHT:0.80}
    freshness-weight: ${MATCH_FRESHNESS_WEIGHT:0.20}
    metres-per-second: ${MATCH_METRES_PER_SECOND:8.33}
  assignment:
    offer-ttl: ${ASSIGNMENT_OFFER_TTL:90s}
    max-preflight-age: ${ASSIGNMENT_MAX_PREFLIGHT_AGE:5s}
  recovery:
    enabled: ${RECOVERY_ENABLED:true}
    batch-size: ${RECOVERY_BATCH_SIZE:50}
    sweep-interval-ms: ${RECOVERY_SWEEP_INTERVAL_MS:5000}
  demo:
    enabled: ${DEMO_ENABLED:false}
    oidc-issuer: ${DEMO_OIDC_ISSUER:${OIDC_ISSUER:}}
    customer-subject: ${DEMO_CUSTOMER_SUBJECT:fleetflow-demo-customer}
    merchant-subject: ${DEMO_MERCHANT_SUBJECT:fleetflow-demo-merchant}
    driver-subject: ${DEMO_DRIVER_SUBJECT:fleetflow-demo-driver}
    dispatcher-subject: ${DEMO_DISPATCHER_SUBJECT:fleetflow-demo-dispatcher}
    operator-subject: ${DEMO_OPERATOR_SUBJECT:fleetflow-demo-operator}
springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    operations-sorter: alpha
    tags-sorter: alpha
