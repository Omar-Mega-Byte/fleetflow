spring:
  application:
    name: fleetflow
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:}
          jwk-set-uri: ${OIDC_JWKS_URI:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
  level:
    org.hibernate.orm.jdbc.error: OFF
fleetflow:
  security:
    audience: ${OIDC_AUDIENCE:}
  location:
    heartbeat-ttl: ${LOCATION_HEARTBEAT_TTL:30s}
    location-ttl: ${LOCATION_TTL:2m}
    max-gps-age: ${LOCATION_MAX_GPS_AGE:45s}
    max-ingest-age: ${LOCATION_MAX_INGEST_AGE:2m}
    future-skew: ${LOCATION_FUTURE_SKEW:5s}
    max-radius-meters: ${LOCATION_MAX_RADIUS_METERS:20000}
    max-results: ${LOCATION_MAX_RESULTS:50}
    overfetch-factor: ${LOCATION_OVERFETCH_FACTOR:4}
    overfetch-cap: ${LOCATION_OVERFETCH_CAP:200}
    update-limit: ${LOCATION_UPDATE_LIMIT:30}
    update-window: ${LOCATION_UPDATE_WINDOW:1m}
    heartbeat-limit: ${LOCATION_HEARTBEAT_LIMIT:60}
    heartbeat-window: ${LOCATION_HEARTBEAT_WINDOW:1m}
springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    operations-sorter: alpha
    tags-sorter: alpha
