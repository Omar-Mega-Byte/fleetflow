name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tracked credential preflight
        run: python3 scripts/Phase11-Secret-Audit.py
      - name: Verify
        run: ./mvnw verify --batch-mode --no-transfer-progress
